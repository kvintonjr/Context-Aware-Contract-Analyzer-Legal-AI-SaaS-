<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contract Analyzer</title>
    <style>
        body { font-family: sans-serif; margin: 2em; }
        textarea { width: 100%; height: 200px; }
        .results { margin-top: 1em; border: 1px solid #ccc; padding: 1em; }
    </style>
</head>
<body>
    <h1>Contract Analyzer</h1>
    <form id="contract-form">
        <textarea id="contract-text" placeholder="Paste your contract text here..."></textarea>
        <br>
        <button type="submit">Analyze</button>
    </form>
    <div id="results" class="results" style="display:none;">
        <h2>Analysis Results</h2>
        <h3>Summary</h3>
        <p id="summary"></p>
        <h3>Risks</h3>
        <ul id="risks"></ul>
        <h3>Risk Score</h3>
        <p id="risk-score"></p>
    </div>
    <script>
        document.getElementById('contract-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const contractText = document.getElementById('contract-text').value;
            const response = await fetch('http://127.0.0.1:5000/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contract_text: contractText })
            });
            const results = await response.json();
            document.getElementById('summary').textContent = results.summary;
            const risksList = document.getElementById('risks');
            risksList.innerHTML = '';
            results.risks.forEach(risk => {
                const li = document.createElement('li');
                li.textContent = `${risk.clause} (${risk.risk_level}): ${risk.explanation}`;
                risksList.appendChild(li);
            });
            document.getElementById('risk-score').textContent = results.risk_score;
            document.getElementById('results').style.display = 'block';
        });
    </script>
</body>
</html>
